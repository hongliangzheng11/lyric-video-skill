      <script>
        (function () {
          var DUR = __DUR__;
          var N = 96;
          var ANGLES = [];
          for (var i = 0; i < N; i++) ANGLES.push((i / N) * Math.PI * 2);

          /* ---------- geometry ---------- */
          function arcPoints(cx, cy, rx, ry, a0, a1, steps) {
            var out = [];
            for (var k = 0; k <= steps; k++) {
              var a = a0 + (a1 - a0) * (k / steps);
              out.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]);
            }
            return out;
          }

          function roundedPolyPoints(sides, R, rot, cornerRatio) {
            var v = [];
            for (var i = 0; i < sides; i++) {
              var a = rot + (i / sides) * Math.PI * 2 - Math.PI / 2;
              v.push([Math.cos(a) * R, Math.sin(a) * R]);
            }
            var pts = [];
            for (var j = 0; j < sides; j++) {
              var p = v[j];
              var prev = v[(j - 1 + sides) % sides];
              var next = v[(j + 1) % sides];
              var d1 = Math.hypot(prev[0] - p[0], prev[1] - p[1]);
              var d2 = Math.hypot(next[0] - p[0], next[1] - p[1]);
              var t = Math.min(d1, d2) * cornerRatio;
              var p1 = [p[0] + ((prev[0] - p[0]) / d1) * t, p[1] + ((prev[1] - p[1]) / d1) * t];
              var p2 = [p[0] + ((next[0] - p[0]) / d2) * t, p[1] + ((next[1] - p[1]) / d2) * t];
              for (var s = 0; s <= 14; s++) {
                var u = s / 14;
                pts.push([
                  (1 - u) * (1 - u) * p1[0] + 2 * (1 - u) * u * p[0] + u * u * p2[0],
                  (1 - u) * (1 - u) * p1[1] + 2 * (1 - u) * u * p[1] + u * u * p2[1],
                ]);
              }
            }
            return pts;
          }

          function roundedRectPoints(w, h, r) {
            var hw = w / 2, hh = h / 2, pts = [];
            pts.push([-hw + r, -hh], [hw - r, -hh]);
            pts = pts.concat(arcPoints(hw - r, -hh + r, r, r, -Math.PI / 2, 0, 10));
            pts.push([hw, hh - r]);
            pts = pts.concat(arcPoints(hw - r, hh - r, r, r, 0, Math.PI / 2, 10));
            pts.push([-hw + r, hh]);
            pts = pts.concat(arcPoints(-hw + r, hh - r, r, r, Math.PI / 2, Math.PI, 10));
            pts.push([-hw, -hh + r]);
            pts = pts.concat(arcPoints(-hw + r, -hh + r, r, r, Math.PI, Math.PI * 1.5, 10));
            return pts;
          }

          function radiusAt(pts, ang) {
            var ux = Math.cos(ang), uy = Math.sin(ang), best = 0;
            for (var i = 0; i < pts.length; i++) {
              var p = pts[i], q = pts[(i + 1) % pts.length];
              var ex = q[0] - p[0], ey = q[1] - p[1];
              var den = ux * ey - uy * ex;
              if (Math.abs(den) < 1e-9) continue;
              var s = (p[0] * ey - p[1] * ex) / den;
              var t = (p[0] * uy - p[1] * ux) / den;
              if (s > 0 && t >= -0.0001 && t <= 1.0001 && s > best) best = s;
            }
            return best;
          }

          function toRadial(pts) {
            var out = [];
            for (var i = 0; i < N; i++) out.push(radiusAt(pts, ANGLES[i]));
            return out;
          }

          var R = 214;
          var SHAPES = [

            toRadial(arcPoints(0, 0, R, R * 0.70, 0, Math.PI * 2, 240)),
            toRadial(arcPoints(0, 0, R * 0.72, R, 0, Math.PI * 2, 240)),
            toRadial(roundedRectPoints(R * 1.78, R * 1.40, 74)),
            toRadial(roundedPolyPoints(4, R, Math.PI / 4, 0.30)),
            toRadial(roundedPolyPoints(3, R, Math.PI, 0.26)),
            toRadial(roundedPolyPoints(5, R, -Math.PI / 2, 0.28)),
            toRadial(roundedPolyPoints(6, R, 0, 0.26)),

            for (var i = 1; i < N; i++) {

            }

          /* ---------- precomputed drift + bounces ---------- */
          var MOTION = /*__MOTION__*/{ "legs": [], "bounces": [] };
          var ENERGY = /*__ENERGY__*/[[0, 1, 0.02]];

          function energyAt(t) {
            for (var i = 0; i < ENERGY.length; i++) {
              if (t >= ENERGY[i][0] && t < ENERGY[i][1]) {

          var lyricEls = [];
          var lyricsRoot = document.getElementById("lyrics");
          for (var li = 0; li < LYRICS.length; li++) {
            var L = LYRICS[li];

            el.appendChild(en);

          }

          function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
          function smooth(a, b, x) { var u = clamp01((x - a) / (b - a)); return u * u * (3 - 2 * u); }

              var mid = (lo + hi) >> 1;

          var glowEl = document.getElementById("rimGlow");
          var shadeEl = document.getElementById("innerShade");

          var titleEl = document.getElementById("title");
          var outroEl = document.getElementById("outro");
          var fadeEl = document.getElementById("fade");

          function render(t) {
            var leg = legAt(t);
            var u = clamp01((t - leg.t0) / Math.max(0.001, leg.t1 - leg.t0));
            var x = lerp(leg.x0, leg.x1, u);

              if (bc.nx !== 0) sx = sq; else sy = sq;
            }
            bubbleEl.setAttribute("transform",
              "translate(" + x.toFixed(2) + " " + y.toFixed(2) + ") scale(" + sx.toFixed(4) + " " + sy.toFixed(4) + ")");

            /* background breathing */
            var en = energyAt(t);
            var ph = t * 0.11;
            glow1.setAttribute("transform", "translate(" + (Math.sin(ph) * 34).toFixed(1) + " " + (Math.cos(ph * 0.8) * 26).toFixed(1) + ") scale(" + (1 + 0.06 * Math.sin(ph * 0.6)).toFixed(3) + ")");
            glow2.setAttribute("transform", "translate(" + (Math.cos(ph * 0.9) * -30).toFixed(1) + " " + (Math.sin(ph * 0.7) * 22).toFixed(1) + ") scale(" + (1 + 0.07 * Math.cos(ph * 0.5)).toFixed(3) + ")");
            glow3.setAttribute("transform", "translate(" + (Math.sin(ph * 0.7 + 1.2) * 26).toFixed(1) + " " + (Math.cos(ph * 0.6) * -18).toFixed(1) + ") scale(" + (1 + 0.05 * Math.sin(ph * 0.45 + 2)).toFixed(3) + ")");
            glowwrap2.style.opacity = (0.16 + 0.26 * (0.5 + 0.5 * Math.sin(t * 0.048 + 0.7)) + en * 0.10).toFixed(3);
            tintEl.style.opacity = (0.10 + en * 0.22).toFixed(3);
            bandGlowEl.style.opacity = (0.52 + 0.16 * Math.sin(t * 0.085 + 1.1) + en * 0.16).toFixed(3);

            /* band: 109-frame loop at 24 fps, two sprite sheets of 8x7 cells */
            var bi = Math.floor(t * 24) % 109;
            if (bi !== bandIdx) {
              bandIdx = bi;
              var sheet = bi < 56 ? 0 : 1;
              if (sheet !== bandSheet) {
                bandSheet = sheet;
                bandAEl.style.opacity = sheet === 0 ? "1" : "0";
                bandBEl.style.opacity = sheet === 0 ? "0" : "1";
              }
              var local = sheet === 0 ? bi : bi - 56;
              (sheet === 0 ? bandAEl : bandBEl).style.backgroundPosition =
                (-(local % 8) * 1080) + "px " + (-Math.floor(local / 8) * 526) + "px";
            }

            /* lyrics */
            for (var i2 = 0; i2 < LYRICS.length; i2++) {
              var L2 = LYRICS[i2];
              var fin = Math.min(0.24, Math.max(0.14, (L2.end - L2.start) * 0.16));
              var outEnd = Math.min(L2.end + 0.16, L2.ns - 0.02);
              var outIn = Math.max(L2.start + 0.3, Math.min(L2.end - 0.16, outEnd - 0.12));
              var a2 = smooth(L2.start - 0.22, L2.start + fin, t) * (1 - smooth(outIn, outEnd, t));
              var el2 = lyricEls[i2];
              if (a2 <= 0.002) {
                if (el2.style.opacity !== "0") { el2.style.opacity = "0"; el2.style.visibility = "hidden"; }
              } else {
                el2.style.visibility = "visible";
                el2.style.opacity = a2.toFixed(3);
                el2.style.transform = "translateY(-50%) translateY(" + ((1 - smooth(L2.start - 0.22, L2.start + fin, t)) * 16).toFixed(2) + "px)";
              }
            }

            /* credit + title + outro */
            creditEl.style.opacity = (0.55 * smooth(13.2, 14.8, t) * (1 - smooth(__CREDIT_OUT0__, __CREDIT_OUT1__, t))).toFixed(3);
            titleEl.style.opacity = (smooth(__TITLE_IN0__, __TITLE_IN1__, t) * (1 - smooth(__TITLE_OUT0__, __TITLE_OUT1__, t))).toFixed(3);
            titleEl.style.transform = "translateY(-50%) translateY(" + ((1 - smooth(__TITLE_IN0__, __TITLE_IN1P__, t)) * 22).toFixed(2) + "px)";
            outroEl.style.opacity = smooth(__OUTRO_IN0__, __OUTRO_IN1__, t).toFixed(3);
            fadeEl.style.opacity = (smooth(__FADE0__, __FADE1__, t) * 0.96).toFixed(3);
          }

          render(0);
          var tl = gsap.timeline({ paused: true });
          var st = { t: 0 };
          tl.to(st, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { render(st.t); } }, 0);
          window.__timelines = window.__timelines || {};
          window.__timelines["01-f1"] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
