      <script>
        (function () {
          var DUR = __DUR__;
          var N = 96;
          var ANGLES = [];
          for (var i = 0; i < N; i++) ANGLES.push((i / N) * Math.PI * 2);

          /* ---------- geometry ---------- */
          function arcPoints(cx, cy, rx, ry, a0, a1, steps) {
            var out = [];
            for (var k = 0; k <= steps; k++) {
              var a = a0 + (a1 - a0) * (k / steps);
              out.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]);
            }
            return out;
          }

          function roundedPolyPoints(sides, R, rot, cornerRatio) {
            var v = [];
            for (var i = 0; i < sides; i++) {
              var a = rot + (i / sides) * Math.PI * 2 - Math.PI / 2;
              v.push([Math.cos(a) * R, Math.sin(a) * R]);
            }
            var pts = [];
            for (var j = 0; j < sides; j++) {
              var p = v[j];
              var prev = v[(j - 1 + sides) % sides];
              var next = v[(j + 1) % sides];
              var d1 = Math.hypot(prev[0] - p[0], prev[1] - p[1]);
              var d2 = Math.hypot(next[0] - p[0], next[1] - p[1]);
              var t = Math.min(d1, d2) * cornerRatio;
              var p1 = [p[0] + ((prev[0] - p[0]) / d1) * t, p[1] + ((prev[1] - p[1]) / d1) * t];
              var p2 = [p[0] + ((next[0] - p[0]) / d2) * t, p[1] + ((next[1] - p[1]) / d2) * t];
              for (var s = 0; s <= 14; s++) {
                var u = s / 14;
                pts.push([
                  (1 - u) * (1 - u) * p1[0] + 2 * (1 - u) * u * p[0] + u * u * p2[0],
                  (1 - u) * (1 - u) * p1[1] + 2 * (1 - u) * u * p[1] + u * u * p2[1],
                ]);
              }
            }
            return pts;
          }

          function roundedRectPoints(w, h, r) {
            var hw = w / 2, hh = h / 2, pts = [];
            pts.push([-hw + r, -hh], [hw - r, -hh]);
            pts = pts.concat(arcPoints(hw - r, -hh + r, r, r, -Math.PI / 2, 0, 10));
            pts.push([hw, hh - r]);
            pts = pts.concat(arcPoints(hw - r, hh - r, r, r, 0, Math.PI / 2, 10));
            pts.push([-hw + r, hh]);
            pts = pts.concat(arcPoints(-hw + r, hh - r, r, r, Math.PI / 2, Math.PI, 10));
            pts.push([-hw, -hh + r]);
            pts = pts.concat(arcPoints(-hw + r, -hh + r, r, r, Math.PI, Math.PI * 1.5, 10));
            return pts;
          }

          function radiusAt(pts, ang) {
            var ux = Math.cos(ang), uy = Math.sin(ang), best = 0;
            for (var i = 0; i < pts.length; i++) {
              var p = pts[i], q = pts[(i + 1) % pts.length];
              var ex = q[0] - p[0], ey = q[1] - p[1];
              var den = ux * ey - uy * ex;
              if (Math.abs(den) < 1e-9) continue;
              var s = (p[0] * ey - p[1] * ex) / den;
              var t = (p[0] * uy - p[1] * ux) / den;
              if (s > 0 && t >= -0.0001 && t <= 1.0001 && s > best) best = s;
            }
            return best;
          }

          function toRadial(pts) {
            var out = [];
            for (var i = 0; i < N; i++) out.push(radiusAt(pts, ANGLES[i]));
            return out;
          }

          var R = 214;
          var SHAPES = [
            toRadial(arcPoints(0, 0, R, R, 0, Math.PI * 2, 240)),
            toRadial(arcPoints(0, 0, R, R * 0.70, 0, Math.PI * 2, 240)),
            toRadial(arcPoints(0, 0, R * 0.72, R, 0, Math.PI * 2, 240)),
            toRadial(roundedRectPoints(R * 1.78, R * 1.40, 74)),
            toRadial(roundedPolyPoints(4, R, Math.PI / 4, 0.30)),
            toRadial(roundedPolyPoints(3, R, Math.PI, 0.26)),
            toRadial(roundedPolyPoints(5, R, -Math.PI / 2, 0.28)),
            toRadial(roundedPolyPoints(6, R, 0, 0.26)),
          ];

          function pathFromRadii(r) {
            var d = "M " + r[0].toFixed(2) + " 0";
            for (var i = 1; i < N; i++) {
              d += " L " + (Math.cos(ANGLES[i]) * r[i]).toFixed(2) + " " + (Math.sin(ANGLES[i]) * r[i]).toFixed(2);
            }
            return d + " Z";
          }

          /* ---------- precomputed drift + bounces ---------- */
          var MOTION = /*__MOTION__*/{ "legs": [], "bounces": [] };
          var ENERGY = /*__ENERGY__*/[[0, 1, 0.02]];
          var LYRICS = /*__LYRICS__*/[];
          var BAND = /*__BAND__*/null;

          function energyAt(t) {
            for (var i = 0; i < ENERGY.length; i++) {
              if (t >= ENERGY[i][0] && t < ENERGY[i][1]) {
                var a = ENERGY[i][2];
                var b = i + 1 < ENERGY.length ? ENERGY[i + 1][2] : a;
                var u = (t - ENERGY[i][0]) / Math.max(0.001, ENERGY[i][1] - ENERGY[i][0]);
                return a + (b - a) * Math.min(1, u);
              }
            }
            return 0.3;
          }

          /* ---------- lyric nodes ---------- */
          var lyricEls = [];
          var lyricsRoot = document.getElementById("lyrics");
          for (var li = 0; li < LYRICS.length; li++) {
            var L = LYRICS[li];
            var el = document.createElement("div");
            el.className = "line";
            var en = document.createElement("div");
            en.className = "en";
            en.style.fontSize = L.size + "px";
            en.textContent = L.en;
            var zh = document.createElement("div");
            zh.className = "zh";
            zh.textContent = L.zh;
            el.appendChild(en);
            el.appendChild(zh);
            lyricsRoot.appendChild(el);
            lyricEls.push(el);
          }

          function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
          function smooth(a, b, x) { var u = clamp01((x - a) / (b - a)); return u * u * (3 - 2 * u); }
          function easeInOut(u) { return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; }
          function lerp(a, b, u) { return a + (b - a) * u; }

          var legs = MOTION.legs, bounces = MOTION.bounces;

          function legAt(t) {
            var lo = 0, hi = legs.length - 1;
            while (lo < hi) {
              var mid = (lo + hi) >> 1;
              if (t > legs[mid].t1) lo = mid + 1; else hi = mid;
            }
            return legs[lo];
          }

          var glowEl = document.getElementById("rimGlow");
          var shadeEl = document.getElementById("innerShade");
          var filmEl = document.getElementById("film");
          var lightEl = document.getElementById("innerLight");
          var clipEl = document.getElementById("clipPath");
          var bubbleEl = document.getElementById("bubble");
          var glow1 = document.getElementById("glow1");
          var glow2 = document.getElementById("glow2");
          var glow3 = document.getElementById("glow3");
          var glowwrap2 = document.getElementById("glowwrap2");
          var tintEl = document.getElementById("tint");
          var bandGlowEl = document.getElementById("bandGlow");
          var creditEl = document.getElementById("credit");
          var titleEl = document.getElementById("title");
          var outroEl = document.getElementById("outro");
          var fadeEl = document.getElementById("fade");

          var lastShapeKey = "";

          /* ================= band performance runtime =================
           * Style plan + per-style params arrive pre-baked in BAND (see
           * plan_styles.py / config/styles.json). Everything below is a pure
           * function of t, so any seek renders the same frame as continuous
           * playback — no CSS animations, no per-frame randomness.          */
          var BSEG = (BAND && BAND.plan && BAND.plan.segments) || [];
          var BHOLDS = (BAND && BAND.holds) || [];
          var BEVENTS = (BAND && BAND.events) || [];
          var BCHARS = (BAND && BAND.characters) || {};
          var BSTYLES = (BAND && BAND.styles) || {};
          var BMIX = (BAND && BAND.mix) || 0.45;
          var BANDW = 1080, BANDH = 526, CELLX = 1.5, CELLY = 1.503;

          var bandEls = {};        // style id -> {wrap, a, b, idx, sheet}
          var accPool = [];        // recycled accent nodes
          var ACC_POOL = 26;

          var curStyle = null, curCfg = null, prevStyle = null, mixT0 = -1;

          (function initBand() {
            var stage = document.getElementById("bandStage");
            if (!stage) return;
            var wraps = stage.querySelectorAll(".bandstyle");

            var accRoot = document.getElementById("bandAccents");
            for (var k = 0; k < ACC_POOL; k++) {
              var d = document.createElement("div");
              d.className = "acc";
              accRoot.appendChild(d);
              accPool.push({el: d, ev: null});
            }
          })();

          function styleAt(t) {
            if (!BSEG.length) return null;
            var lo = 0, hi = BSEG.length - 1;
            while (lo < hi) {
              var mid = (lo + hi) >> 1;
              if (t < BSEG[mid].t1) hi = mid; else lo = mid + 1;
            }
            return BSEG[lo].style;
          }

          function rateAt(t) {
            var s = styleAt(t);
            return (BSTYLES[s] && BSTYLES[s].rate) || 1.0;
          }

          /* loop time: integrates playback rate, freezes during hold frames */
          function loopTime(t) {
            var lt = 0, prev = 0;
            for (var i = 0; i < BHOLDS.length; i++) {
              var h = BHOLDS[i];
              if (h.t >= t) break;
              if (t < h.t + h.dur) return lt + (h.t - prev) * rateAt(prev);
              lt += (h.t + h.dur - prev) * rateAt(h.t + h.dur);
              prev = h.t + h.dur;
            }
            return lt + (t - prev) * rateAt(t);
          }

          function applyGlow(cfg) {
            var g = cfg.glow || {rgb: [44, 118, 150], base: 0.52};
            var c = "rgba(" + g.rgb[0] + "," + g.rgb[1] + "," + g.rgb[2] + ",";
            bandGlowEl.style.background =
              "radial-gradient(46% 31% at 50% 89%, " + c + g.base + ") 0%, " +
              c + (g.base * 0.33).toFixed(3) + ") 46%, " + c + "0) 76%)";
          }

          function switchStyle(sid, t) {
            if (sid === curStyle || !bandEls[sid]) return;
            prevStyle = curStyle;
            curStyle = sid;
            curCfg = BSTYLES[sid];
            mixT0 = t;
            applyGlow(curCfg);
          }

          /* beat-synced bounce: impact right on the beat, settle until the next */
          function beatBounce(t, beats, every) {
            if (!beats.length) return 0;
            var lo = 0, hi = beats.length - 1;
            while (lo < hi) {
              var mid = (lo + hi) >> 1;
              if (beats[mid] <= t) lo = mid + 1; else hi = mid;
            }
            var i = Math.max(0, lo - 1);
            if (i % every !== 0) i -= (i % every);
            var bt = beats[i], bn = beats[Math.min(beats.length - 1, i + every)];
            var u = (t - bt) / Math.max(0.05, bn - bt);
            if (u < 0) u = 0;
            if (u > 1) u = 1;
            return Math.pow(1 - u, 1.6);
          }

          function bandFrameFor(el, bi, loopFrames) {
            var sheet = bi < 56 ? 0 : 1;
            if (sheet !== el.sheet) {
              el.sheet = sheet;
              el.a.style.opacity = sheet === 0 ? "1" : "0";
              el.b.style.opacity = sheet === 0 ? "0" : "1";
            }
            var local = sheet === 0 ? bi : bi - 56;
            (sheet === 0 ? el.a : el.b).style.backgroundPosition =
              (-(local % 8) * BANDW) + "px " + (-Math.floor(local / 8) * BANDH) + "px";
            el.idx = bi;
          }

          /* accent glyphs — pure SVG, no font dependency */
          function accentSVG(kind, color) {
            if (kind === "note") {
              return '<svg viewBox="0 0 24 24" width="100%" height="100%">' +
                '<ellipse cx="7.2" cy="17" rx="3.6" ry="2.8" transform="rotate(-18 7.2 17)" fill="' + color + '"/>' +
                '<rect x="10.1" y="3.4" width="1.7" height="14" fill="' + color + '"/>' +
                '<path d="M11.8 3.4c3 .8 4.7 2.6 5.1 5.6-1.4-1.8-3.1-2.6-5.1-2.9v-2.7z" fill="' + color + '"/></svg>';
            }
            if (kind === "heart") {
              return '<svg viewBox="0 0 24 24" width="100%" height="100%">' +
                '<path d="M12 20.6S4 15.7 4 10.3A4.5 4.5 0 0 1 12 7.5a4.5 4.5 0 0 1 8 2.8c0 5.4-8 10.3-8 10.3z" fill="' + color + '"/></svg>';
            }
            if (kind === "spark") {
              return '<svg viewBox="0 0 24 24" width="100%" height="100%">' +
                '<path d="M12 1.4l2.2 7.5 7.6 2.2-7.6 2.2L12 21.6l-2.2-7.5-7.6-2.2 7.6-2.2z" fill="' + color + '"/></svg>';
            }
            if (kind === "bang") {
              return '<svg viewBox="0 0 24 24" width="100%" height="100%">' +
                '<path d="M12 3.2v9.4" stroke="' + color + '" stroke-width="4.2" stroke-linecap="round"/>' +
                '<circle cx="12" cy="17.6" r="2.5" fill="' + color + '"/></svg>';
            }
            /* quest */
            return '<svg viewBox="0 0 24 24" width="100%" height="100%">' +
              '<path d="M7.8 8.6a4.3 4.3 0 1 1 6.9 3.4c-1.2.9-1.9 1.8-1.9 3.3" fill="none" stroke="' + color +
              '" stroke-width="2.7" stroke-linecap="round"/>' +
              '<circle cx="12.8" cy="18.6" r="1.9" fill="' + color + '"/></svg>';
          }

          var ACC_DUR = {note: 1.5, heart: 1.5, spark: 1.1, bang: 0.7, quest: 0.85};
          var ACC_SIZE = {note: 48, heart: 46, spark: 38, bang: 56, quest: 56};
          var ACC_RISE = {note: 96, heart: 88, spark: 110, bang: 60, quest: 64};

          function updateAccents(t) {
            var vis = 0;
            for (var i = 0; i < BEVENTS.length; i++) {
              var e = BEVENTS[i];
              if (e.t > t) break;
              var a = t - e.t, dur = ACC_DUR[e.kind] || 1.2;
              if (a < dur) vis++;
              if (vis > ACC_POOL) break;
            }
            var slot = 0;
            for (var j = 0; j < BEVENTS.length && slot < vis; j++) {
              var ev = BEVENTS[j];
              if (ev.t > t) break;
              var age = t - ev.t, d = ACC_DUR[ev.kind] || 1.2;
              if (age >= d) continue;
              slot++;
              var p = accPool[slot - 1], el = p.el;
              if (p.ev !== ev) {
                p.ev = ev;
                var col = ((BSTYLES[curStyle] || {}).accents || {}).colors || {};
                el.innerHTML = accentSVG(ev.kind, col[ev.kind] || "#FFFFFF");
              }
              var u = age / d;
              var ch = (BCHARS[ev.char] || {}).spawn || [360, 60];
              var size = (ACC_SIZE[ev.kind] || 40) * ((BSTYLES[curStyle] || {}).accents || {}).scale || 40;
              var jx = (((ev.t * 9973 + slot * 7919) % 100) / 100 - 0.5) * 18;
              var x = ch[0] * CELLX + jx, y = ch[1] * CELLY;
              var rise = (ACC_RISE[ev.kind] || 90) * (1 - Math.pow(1 - u, 2));
              var op = Math.sin(Math.PI * u);
              var sc = 0.55 + 0.45 * Math.min(1, u * 4) * (1 - 0.25 * u);
              el.style.opacity = op.toFixed(3);
              el.style.width = size + "px";
              el.style.height = size + "px";
              el.style.transform =
                "translate(" + (x - size / 2).toFixed(1) + "px," + (y - size / 2 - rise).toFixed(1) + "px)" +
                " rotate(" + (Math.sin(u * 6.28 + slot) * 9).toFixed(1) + "deg) scale(" + sc.toFixed(3) + ")";
              el.style.visibility = op > 0.004 ? "visible" : "hidden";
            }
            for (var k = slot; k < accPool.length; k++) {
              if (accPool[k].el.style.visibility !== "hidden") {
                accPool[k].el.style.visibility = "hidden";
                accPool[k].el.style.opacity = "0";
                accPool[k].ev = null;
              }
            }
          }

          function renderBand(t, en) {
            var sid = styleAt(t);
            if (!sid) return;
            if (sid !== curStyle) switchStyle(sid, t);
            var cfg = BSTYLES[sid] || BSTYLES.classic;
            if (!cfg) return;
            var ch = cfg.choreo || {};
            var beats = (BAND.music || {}).beats || [];
            var dbeats = (BAND.music || {}).downbeats || [];

            /* cross-fade wrappers driven by timeline time (not CSS) */
            var fadeOld = 0, fadeNew = 1;
            if (prevStyle && bandEls[prevStyle] && t < mixT0 + BMIX) {
              fadeNew = clamp01((t - mixT0) / BMIX);
              fadeOld = 1 - fadeNew;
              fadeNew = fadeNew * fadeNew * (3 - 2 * fadeNew);
              fadeOld = 1 - (1 - fadeOld) * (1 - fadeOld);
            }
            for (var key in bandEls) {
              if (!Object.prototype.hasOwnProperty.call(bandEls, key)) continue;
              var e = bandEls[key];
              var op = key === curStyle ? fadeNew : (key === prevStyle ? fadeOld : 0);
              if (Math.abs(parseFloat(e.wrap.style.opacity || "0") - op) > 0.003) {
                e.wrap.style.opacity = op.toFixed(3);
              }
            }

            /* choreography — deterministic curves in t */
            var bounce = (ch.bounce_amp || 0) * beatBounce(t, beats, ch.bounce_beats || 2) * (0.55 + 0.45 * en);
            var sway = (ch.sway_amp || 0) * Math.sin(2 * Math.PI * t / (ch.sway_period || 8));
            var breathe = 1 + (ch.breathe_amp || 0) * Math.sin(2 * Math.PI * t / (ch.breathe_period || 12));
            var punch = (ch.beat_punch || 0) * beatBounce(t, dbeats, 1);
            var holdPop = 0;
            for (var h = 0; h < BHOLDS.length; h++) {
              if (BHOLDS[h].t > t) break;
              if (t >= BHOLDS[h].t && t < BHOLDS[h].t + BHOLDS[h].dur) {
                holdPop = 0.02 * Math.exp(-(t - BHOLDS[h].t) * 9);
              }
            }
            var wrap = bandEls[curStyle].wrap;
            wrap.style.transform = "translateY(" + (-bounce).toFixed(2) + "px) rotate(" +
              sway.toFixed(3) + "deg) scale(" + (breathe + punch + holdPop).toFixed(4) + ")";

            /* loop frame: freeze during holds via loopTime integration */
            var lt = loopTime(t);
            var loopFrames = cfg.loop_frames || 109;
            var fps = cfg.loop_fps || 24;
            var bi = Math.floor(lt * fps) % loopFrames;
            if (bi < 0) bi += loopFrames;
            var el = bandEls[curStyle];
            if (bi !== el.idx) bandFrameFor(el, bi, loopFrames);
            if (prevStyle && fadeOld > 0.003 && bandEls[prevStyle]) {
              // outgoing wrapper keeps its own playback rate during the dissolve
              var pcfg = BSTYLES[prevStyle] || cfg;
              var pe = bandEls[prevStyle];
              var pbi = Math.floor(t * (pcfg.rate || 1) * (pcfg.loop_fps || 24))
                % (pcfg.loop_frames || 109);
              if (pbi !== pe.idx) bandFrameFor(pe, pbi, pcfg.loop_frames || 109);
            }

            /* stage light breathes with the style palette */
            var g = cfg.glow || {base: 0.52, breath: 0.16, energy: 0.16};
            bandGlowEl.style.opacity = (g.base + g.breath * Math.sin(t * 0.085 + 1.1) + g.energy * en).toFixed(3);

            updateAccents(t);
          }

          function render(t) {
            var leg = legAt(t);
            var u = clamp01((t - leg.t0) / Math.max(0.001, leg.t1 - leg.t0));
            var x = lerp(leg.x0, leg.x1, u);
            var y = lerp(leg.y0, leg.y1, u);

            /* shape + morph */
            var radii = SHAPES[0], shapeKey = "s0", lastB = null;
            for (var b = 0; b < bounces.length; b++) {
              if (bounces[b].t <= t) lastB = bounces[b]; else break;
            }
            if (lastB) {
              var p = clamp01((t - lastB.m0) / (lastB.m1 - lastB.m0));
              var e = easeInOut(p);
              var A = SHAPES[lastB.from], B = SHAPES[lastB.to];
              if (e >= 1) { radii = B; shapeKey = "s" + lastB.to; }
              else {
                radii = new Array(N);
                for (var q = 0; q < N; q++) radii[q] = A[q] + (B[q] - A[q]) * e;
                shapeKey = "m" + lastB.from + "-" + lastB.to + "-" + e.toFixed(3);
              }
            }
            if (shapeKey !== lastShapeKey) {
              var d = pathFromRadii(radii);
              bodyEl.setAttribute("d", d);
              glowEl.setAttribute("d", d);
              shadeEl.setAttribute("d", d);
              filmEl.setAttribute("d", d);
              lightEl.setAttribute("d", d);
              clipEl.setAttribute("d", d);
              lastShapeKey = shapeKey;
            }

            /* elastic compression on impact */
            var sx = 1, sy = 1;
            for (var c = 0; c < bounces.length; c++) {
              var bc = bounces[c];
              if (bc.t < t - 0.30) continue;
              if (bc.t > t + 0.26) break;
              var sq = 1 - 0.11 * Math.sin(Math.PI * clamp01((t - (bc.t - 0.20)) / 0.50));
              if (bc.nx !== 0) sx = sq; else sy = sq;
            }
            bubbleEl.setAttribute("transform",
              "translate(" + x.toFixed(2) + " " + y.toFixed(2) + ") scale(" + sx.toFixed(4) + " " + sy.toFixed(4) + ")");

            /* background breathing */
            var en = energyAt(t);
            var ph = t * 0.11;
            glow1.setAttribute("transform", "translate(" + (Math.sin(ph) * 34).toFixed(1) + " " + (Math.cos(ph * 0.8) * 26).toFixed(1) + ") scale(" + (1 + 0.06 * Math.sin(ph * 0.6)).toFixed(3) + ")");
            glow2.setAttribute("transform", "translate(" + (Math.cos(ph * 0.9) * -30).toFixed(1) + " " + (Math.sin(ph * 0.7) * 22).toFixed(1) + ") scale(" + (1 + 0.07 * Math.cos(ph * 0.5)).toFixed(3) + ")");
            glow3.setAttribute("transform", "translate(" + (Math.sin(ph * 0.7 + 1.2) * 26).toFixed(1) + " " + (Math.cos(ph * 0.6) * -18).toFixed(1) + ") scale(" + (1 + 0.05 * Math.sin(ph * 0.45 + 2)).toFixed(3) + ")");
            glowwrap2.style.opacity = (0.16 + 0.26 * (0.5 + 0.5 * Math.sin(t * 0.048 + 0.7)) + en * 0.10).toFixed(3);
            tintEl.style.opacity = (0.10 + en * 0.22).toFixed(3);

            /* band: style-driven performance (sheets, rate, choreography, accents) */
            if (BAND) renderBand(t, en);

            /* lyrics */
            for (var i2 = 0; i2 < LYRICS.length; i2++) {
              var L2 = LYRICS[i2];
              var fin = Math.min(0.24, Math.max(0.14, (L2.end - L2.start) * 0.16));
              var outEnd = Math.min(L2.end + 0.16, L2.ns - 0.02);
              var outIn = Math.max(L2.start + 0.3, Math.min(L2.end - 0.16, outEnd - 0.12));
              var a2 = smooth(L2.start - 0.22, L2.start + fin, t) * (1 - smooth(outIn, outEnd, t));
              var el2 = lyricEls[i2];
              if (a2 <= 0.002) {
                if (el2.style.opacity !== "0") { el2.style.opacity = "0"; el2.style.visibility = "hidden"; }
              } else {
                el2.style.visibility = "visible";
                el2.style.opacity = a2.toFixed(3);
                el2.style.transform = "translateY(-50%) translateY(" + ((1 - smooth(L2.start - 0.22, L2.start + fin, t)) * 16).toFixed(2) + "px)";
              }
            }

            /* credit + title + outro */
            creditEl.style.opacity = (0.55 * smooth(13.2, 14.8, t) * (1 - smooth(__CREDIT_OUT0__, __CREDIT_OUT1__, t))).toFixed(3);
            titleEl.style.opacity = (smooth(__TITLE_IN0__, __TITLE_IN1__, t) * (1 - smooth(__TITLE_OUT0__, __TITLE_OUT1__, t))).toFixed(3);
            titleEl.style.transform = "translateY(-50%) translateY(" + ((1 - smooth(__TITLE_IN0__, __TITLE_IN1P__, t)) * 22).toFixed(2) + "px)";
            outroEl.style.opacity = smooth(__OUTRO_IN0__, __OUTRO_IN1__, t).toFixed(3);
            fadeEl.style.opacity = (smooth(__FADE0__, __FADE1__, t) * 0.96).toFixed(3);
          }

          render(0);
          var tl = gsap.timeline({ paused: true });
          var st = { t: 0 };
          tl.to(st, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { render(st.t); } }, 0);
          window.__timelines = window.__timelines || {};
          window.__timelines["01-f1"] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
